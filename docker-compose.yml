services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentic_sdlc_db
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: agentic_sdlc
    ports:
      - "5432:5432"
    volumes:
      - agentic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_sdlc"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agentic_sdlc_app
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://agentic:localdevpassword@db:5432/agentic_sdlc
      WORKSPACE_ROOT: /tmp/agentic-workspaces
      UI_BASIC_AUTH_USERNAME: ${UI_BASIC_AUTH_USERNAME:-operator}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:?Set UI_BASIC_AUTH_PASSWORD in .env}
    ports: ["8000:8000"]
    volumes:
      - agentic_workspaces:/tmp/agentic-workspaces
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  agentic_pgdata:
  agentic_workspaces:
